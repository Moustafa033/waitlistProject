<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Unsubscribe — Brand AI</title>
  <link rel="stylesheet" href="/assets/app.css">
  <script src="/assets/config.js" defer></script>
  <script src="/assets/unsubscribe.js" defer></script>
</head>
<body>
  <main class="card">
    <h1>Unsubscribe</h1>
    <p>Press a button below. No login needed.</p>
    <p><b>Unsubscribe:</b> we stop emailing you. You can join again later.</p>
    <button id="wl-unsub" type="button">Unsubscribe</button>
    <p><b>Delete my data:</b> your email address is removed from our list immediately. We keep only a
      one-way fingerprint of it so that we never email you again.</p>
    <button id="wl-erase" type="button">Delete my data</button>
    <p id="wl-status" class="status" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
