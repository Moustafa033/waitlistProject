<div class="sg-bg" aria-hidden="true">

<div class="sg-glow sg-glow-c"></div>
</div>

<div class="sg-wrap">

    <svg class="mark" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false">

  <main class="sg-confirm">

      <span class="sg-chip">CREATORS &amp; COACHES PROGRAM</span>

      <p id="pc-status" class="status" role="status" aria-live="polite"></p>
    </div>
  </main>

  <footer class="sg-foot">
    <span class="sg-foot-brand"><img src="/assets/partners/icon.webp" alt="" width="28" height="28"><span>© 2026 Saigenai · made by <a href="/">Creating in Public</a></span></span>
