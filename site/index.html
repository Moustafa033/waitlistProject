<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Creating in Public — join the waitlist</title>
  <meta name="description" content="Every big idea starts in a room. Be part of it: join the Creating in Public waitlist.">
  <link rel="preload" href="/assets/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/app.css">
  <!-- No inline scripts, inline styles or inline event handlers: the CSP forbids them (that is the XSS defense). -->
  <script src="/assets/config.js" defer></script>
  <script src="/assets/signup.js" defer></script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
</head>
<body>
  <div class="page">
    <header class="bar top">
      <a class="brand" href="/">
        <svg class="mark" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
          <rect x="2.5" y="2.5" width="19" height="19" rx="6" fill="none" stroke="currentColor" stroke-width="2.2"/>
          <circle cx="12" cy="12" r="4" fill="currentColor"/>
        </svg>
        <span>Creating in Public</span>
      </a>
    </header>

    <main class="hero">
      <div class="glow" aria-hidden="true"></div>
      <p class="pill">Waitlist open</p>
      <h1><span class="l1">Every big idea</span> <span class="l2">starts in a room</span></h1>
      <p class="sub">Be part of it</p>

      <!-- form-action 'none' in the CSP: without our script this form cannot be submitted at all -->
      <form id="wl-form" class="signup" novalidate data-consent-version="waitlist-v3">
        <div class="row">
          <label for="wl-email" class="sr-only">Email</label>
          <input id="wl-email" name="email" type="email" autocomplete="email" inputmode="email" maxlength="254" placeholder="name@domain.com" required>
          <button id="wl-submit" type="submit" disabled>Join now</button>
        </div>

        <!-- honeypot: hidden from people (CSS + aria + tabindex), bots fill it -->
        <div class="hp" aria-hidden="true">
          <label for="wl-website">Website</label>
          <input id="wl-website" name="website" type="text" tabindex="-1" autocomplete="off">
        </div>

        <!-- consent must be UNTICKED by default and specific (GDPR); the exact text is versioned -->
        <div class="checks">
          <label class="check"><input id="wl-consent" type="checkbox" required>
            <span><span class="main">Email me when it's published</span>
              <span class="hint">Brand AI launch and occasional news. Unsubscribe or delete your data anytime. <a href="/privacy">Privacy notice</a></span></span></label>
          <label class="check"><input id="wl-age" type="checkbox" required> <span class="main">I am 16 or older.</span></label>
        </div>

        <div id="wl-turnstile" class="ts"></div>
        <p id="wl-status" class="status" role="status" aria-live="polite"></p>
      </form>
    </main>

    <footer class="bar bottom">
      <span>© 2026 Creating in Public</span><span class="dot" aria-hidden="true">•</span><a href="/privacy">Privacy</a>
    </footer>
  </div>
</body>
</html>
