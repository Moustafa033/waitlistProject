<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brand AI — join the waitlist</title>
  <meta name="description" content="Brand AI is an AI fitness coach. Join the waitlist to hear when it launches.">
  <link rel="stylesheet" href="/assets/app.css">
  <!-- No inline scripts, inline styles or inline event handlers: the CSP forbids them (that is the XSS defense). -->
  <script src="/assets/config.js" defer></script>
  <script src="/assets/signup.js" defer></script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
</head>
<body>
  <main class="card">
    <h1>Brand AI</h1>
    <p class="lead">An AI fitness coach. Be the first to know when it launches.</p>
    <p class="small">Brand AI is an artificial-intelligence product. Its answers are generated by AI.</p>

    <!-- form-action 'none' in the CSP: without our script this form cannot be submitted at all -->
    <form id="wl-form" novalidate data-consent-version="waitlist-v1">
      <label for="wl-email">Email</label>
      <input id="wl-email" name="email" type="email" autocomplete="email" inputmode="email" maxlength="254" required>

      <!-- honeypot: hidden from people (CSS + aria + tabindex), bots fill it -->
      <div class="hp" aria-hidden="true">
        <label for="wl-website">Website</label>
        <input id="wl-website" name="website" type="text" tabindex="-1" autocomplete="off">
      </div>

      <!-- consent must be UNTICKED by default and specific (GDPR); the exact text is versioned -->
      <label class="check"><input id="wl-consent" type="checkbox" required>
        Email me when Brand AI launches (a few emails at most). I can unsubscribe at any time. See the <a href="/privacy">privacy notice</a>.</label>
      <label class="check"><input id="wl-age" type="checkbox" required> I am 16 or older.</label>

      <div id="wl-turnstile" class="ts"></div>
      <button id="wl-submit" type="submit" disabled>Join the waitlist</button>
      <p id="wl-status" class="status" role="status" aria-live="polite"></p>
    </form>
  </main>
  <footer><a href="/privacy">Privacy</a></footer>
</body>
</html>
